name: Build DuelPlugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Read JAR name from pom.xml
        id: jar_name
        run: |
          NAME=$(mvn help:evaluate -Dexpression=jar.finalName -q -DforceStdout)
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Build with Maven
        run: mvn clean package -B --no-transfer-progress

      - name: Verify JAR exists
        run: |
          JAR="target/${{ steps.jar_name.outputs.name }}.jar"
          echo "Looking for: $JAR"
          ls -lh target/
          test -f "$JAR" && echo "JAR found OK" || (echo "JAR NOT FOUND" && exit 1)

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar_name.outputs.name }}-build${{ github.run_number }}
          path: target/${{ steps.jar_name.outputs.name }}.jar
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.jar_name.outputs.name }}
          name: ${{ steps.jar_name.outputs.name }}
          files: target/${{ steps.jar_name.outputs.name }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
